<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <mask id="buddy-b">
      <rect width="256" height="256" fill="#000"/>
      <!-- stem -->
      <rect x="60" y="34" width="56" height="188" rx="28" fill="#fff"/>
      <!-- top bowl -->
      <ellipse cx="138" cy="80" rx="58" ry="50" fill="#fff"/>
      <!-- bottom bowl -->
      <ellipse cx="146" cy="176" rx="70" ry="58" fill="#fff"/>
