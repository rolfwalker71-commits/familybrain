<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Buddy Logo-Vorschläge</title>
    <style>
      :root {
        font-family: ui-sans-serif, system-ui, sans-serif;
        color: #1a1f24;
      }
      body {
        margin: 0;
        padding: 2rem;
        background: #f4f5f7;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.35rem;
      }
      h2 {
        font-size: 1rem;
        margin: 2rem 0 0.75rem;
      }
      p.lead {
        margin: 0 0 1.5rem;
        color: #5b6470;
        font-size: 0.95rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 1rem;
      }
      figure {
        margin: 0;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #d8dee6;
        background: #fff;
      }
      .stage {
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 160px;
      }
      .stage > div {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.25rem;
      }
      .stage .light {
        background: #ffffff
          repeating-conic-gradient(#eceff3 0% 25%, #fff 0% 50%) 50% / 16px 16px;
      }
      .stage .dark {
        background: #1a2620;
      }
      .stage img {
        width: 88px;
        height: 88px;
        object-fit: contain;
      }
      figcaption {
        padding: 0.75rem 0.9rem 1rem;
        border-top: 1px solid #e8ecf1;
        font-size: 0.85rem;
        line-height: 1.35;
      }
      figcaption strong {
        display: block;
        margin-bottom: 0.2rem;
      }
      figcaption span {
        color: #5b6470;
      }
    </style>
  </head>
  <body>
    <h1>Buddy — Logo-Vorschläge</h1>
    <p class="lead">
      Freistehend / transparent. Links Schachbrett, rechts Sidebar-Dunkel. Sag die
      Nummer (oder Mischung).
    </p>

    <h2>Erste Runde</h2>
    <div class="grid">
      <figure>
        <div class="stage">
          <div class="light">
            <img src="buddy-logo-proposal-v1.png" alt="V1" />
          </div>
          <div class="dark">
            <img src="buddy-logo-proposal-v1.png" alt="" />
          </div>
        </div>
        <figcaption>
          <strong>V1 — Figur + Tasche</strong>
          <span>Buddy trägt’s für dich.</span>
        </figcaption>
      </figure>
      <figure>
        <div class="stage">
          <div class="light">
            <img src="buddy-logo-proposal-v2.png" alt="V2" />
          </div>
          <div class="dark">
            <img src="buddy-logo-proposal-v2.png" alt="" />
          </div>
        </div>
        <figcaption>
          <strong>V2 — Monogramm B</strong>
          <span>B mit orangem Begleiter.</span>
        </figcaption>
      </figure>
      <figure>
        <div class="stage">
          <div class="light">
            <img src="buddy-logo-proposal-v3.png" alt="V3" />
          </div>
          <div class="dark">
            <img src="buddy-logo-proposal-v3.png" alt="" />
          </div>
        </div>
        <figcaption>
          <strong>V3 — Stack</strong>
          <span>Gestapelte Kacheln.</span>
        </figcaption>
      </figure>
      <figure>
        <div class="stage">
          <div class="light">
            <img src="buddy-logo-proposal-v4.png" alt="V4" />
          </div>
          <div class="dark">
            <img src="buddy-logo-proposal-v4.png" alt="" />
          </div>
        </div>
        <figcaption>
          <strong>V4 — Orbit (Referenz)</strong>
          <span>Gut, aber zu nah an n8n.</span>
        </figcaption>
      </figure>
      <figure>
        <div class="stage">
          <div class="light">
            <img src="buddy-logo-proposal-v5.png" alt="V5" />
          </div>
          <div class="dark">
            <img src="buddy-logo-proposal-v5.png" alt="" />
          </div>
        </div>
        <figcaption>
          <strong>V5 — Pocket + Funken</strong>
          <span>Persönlicher Ort mit Kern.</span>
        </figcaption>
      </figure>
    </div>

    <h2>Weitere im Hub-Stil (weniger n8n)</h2>
    <div class="grid">
      <figure>
        <div class="stage">
          <div class="light">
            <img src="buddy-logo-proposal-v6.png" alt="V6" />
          </div>
          <div class="dark">
            <img src="buddy-logo-proposal-v6.png" alt="" />
          </div>
        </div>
        <figcaption>
          <strong>V6 — Speichen + Quadrate</strong>
          <span>Gerade Strahlen, gefüllte Kacheln statt Ringe/Kurven.</span>
        </figcaption>
      </figure>
      <figure>
        <div class="stage">
          <div class="light">
            <img src="buddy-logo-proposal-v7.png" alt="V7" />
          </div>
          <div class="dark">
            <img src="buddy-logo-proposal-v7.png" alt="" />
          </div>
        </div>
        <figcaption>
          <strong>V7 — Kern + Bögen</strong>
          <span>Konzentrisch: orangener Kern, offener Ring.</span>
        </figcaption>
      </figure>
      <figure>
        <div class="stage">
          <div class="light">
            <img src="buddy-logo-proposal-v8.png" alt="V8" />
          </div>
          <div class="dark">
            <img src="buddy-logo-proposal-v8.png" alt="" />
          </div>
        </div>
        <figcaption>
          <strong>V8 — Hexagon innen</strong>
          <span>Bereiche sitzen im Hub, keine Leitungen.</span>
        </figcaption>
      </figure>
      <figure>
        <div class="stage">
          <div class="light">
            <img src="buddy-logo-proposal-v9.png" alt="V9" />
          </div>
          <div class="dark">
            <img src="buddy-logo-proposal-v9.png" alt="" />
          </div>
        </div>
        <figcaption>
          <strong>V9 — Dreifach-Lappen</strong>
          <span>Drei Bereiche zu einem Mark, ein orangener Akzent.</span>
        </figcaption>
      </figure>
      <figure>
        <div class="stage">
          <div class="light">
            <img src="buddy-logo-proposal-v10.png" alt="V10" />
          </div>
          <div class="dark">
            <img src="buddy-logo-proposal-v10.png" alt="" />
          </div>
        </div>
        <figcaption>
          <strong>V10 — Fenster + Tabs</strong>
          <span>Ein Ort / eine App mit mehreren Bereichen.</span>
        </figcaption>
      </figure>
    </div>
  </body>
</html>
