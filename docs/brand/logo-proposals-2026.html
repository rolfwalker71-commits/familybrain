<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Buddy Logo-Vorschläge 2026</title>
    <style>
      :root {
        font-family: ui-sans-serif, system-ui, sans-serif;
        color: #1a1f24;
      }
      body {
        margin: 0;
        padding: 2rem;
        background: #f4f5f7;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 0.35rem;
      }
      p.lead {
        margin: 0 0 1.75rem;
        color: #5b6470;
        max-width: 46rem;
        line-height: 1.45;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 1.1rem;
      }
      figure {
        margin: 0;
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid #d8dee6;
        background: #fff;
      }
      figure img {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        background: #fff;
      }
      figcaption {
        padding: 0.85rem 1rem 1rem;
        border-top: 1px solid #e8ecf1;
      }
      figcaption strong {
        display: block;
        font-size: 0.95rem;
        margin-bottom: 0.25rem;
      }
      figcaption span {
        color: #5b6470;
        font-size: 0.85rem;
        line-height: 1.4;
      }
      code {
        font-size: 0.78rem;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <h1>Buddy Logo · Vorschläge 2026</h1>
    <p class="lead">
      PWA-Mock: weisser Hintergrund, Mark freigestellt (kein Rahmen / kein App-Icon-Chrome).
      Bitte einen Buchstaben wählen (A–F) — danach setzen wir App-Mark + PWA-Icons um.
    </p>
    <div class="grid">
      <figure>
        <img src="buddy-logo-2026-a-stack.png" alt="Vorschlag A Stack" />
        <figcaption>
          <strong>A · Stack</strong>
          <span>Klassischer 3-Karten-Stack, Orange vorne — nahe am heutigen Mark.</span>
          <code>buddy-logo-2026-a-stack.png</code>
        </figcaption>
      </figure>
      <figure>
        <img src="buddy-logo-2026-b-layers.png" alt="Vorschlag B Layers" />
        <figcaption>
          <strong>B · Layers</strong>
          <span>Weichere Layer-Notiz-Optik, etwas breitere Stagger.</span>
          <code>buddy-logo-2026-b-layers.png</code>
        </figcaption>
      </figure>
      <figure>
        <img src="buddy-logo-2026-c-mono-b.png" alt="Vorschlag C Mono B" />
        <figcaption>
          <strong>C · Mono B</strong>
          <span>Monogramm „B“ aus drei Slabs — klarer Buchstaben-Bezug.</span>
          <code>buddy-logo-2026-c-mono-b.png</code>
        </figcaption>
      </figure>
      <figure>
        <img src="buddy-logo-2026-d-duo.png" alt="Vorschlag D Duo" />
        <figcaption>
          <strong>D · Duo</strong>
          <span>Zwei Karten + kleiner Companion-Punkt — reduzierter.</span>
          <code>buddy-logo-2026-d-duo.png</code>
        </figcaption>
      </figure>
      <figure>
        <img src="buddy-logo-2026-e-steps.png" alt="Vorschlag E Steps" />
        <figcaption>
          <strong>E · Steps</strong>
          <span>Gleich grosse Kacheln als aufsteigende Treppe.</span>
          <code>buddy-logo-2026-e-steps.png</code>
        </figcaption>
      </figure>
      <figure>
        <img src="buddy-logo-2026-f-capsules.png" alt="Vorschlag F Capsules" />
        <figcaption>
          <strong>F · Capsules</strong>
          <span>Weichere Kapseln / organisch-moderne Variante.</span>
          <code>buddy-logo-2026-f-capsules.png</code>
        </figcaption>
      </figure>
    </div>
  </body>
</html>
